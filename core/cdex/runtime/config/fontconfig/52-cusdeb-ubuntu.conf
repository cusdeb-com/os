<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Make the bundled Ubuntu derivative the default sans-serif UI font
       for the Linux side (Openbox, GTK, LightDM greeter).  This file must
       sort before 60-latin.conf and the 61-urw-*.conf aliases: fontconfig
       inserts each <prefer> right before the requested generic family, so
       the earliest config file ends up first in the candidate list.
       This numbering scheme requires the fontconfig >= 2.14 config layout
       (Debian bookworm and later): on older releases such as bullseye,
       45-latin.conf already carries a <prefer> for sans-serif and this
       52- file would lose to it. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Ubuntu derivative CusDeb</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Ubuntu derivative CusDeb</family>
    </prefer>
  </alias>
</fontconfig>
