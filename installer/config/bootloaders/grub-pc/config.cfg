set default=0
set timeout=10

# live-build places unicode.pf2 at /boot/grub/unicode.pf2, but GRUB's default
# font path looks under /boot/grub/fonts/. Use the $prefix-relative path so the
# font is found on both BIOS and UEFI boots without extra fonts/ directory.
font=$prefix/unicode.pf2

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    if [ "$grub_platform" = "efi" ]; then
        insmod efi_gop
        insmod efi_uga
    fi
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

insmod play
play 960 440 1 0 4 440 1
